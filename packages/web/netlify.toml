[build.environment]
  # FRONTEND_URL is a public production URL (https://giftwhisper.online) hardcoded
  # in canonical/SEO metadata — not a secret, so exclude from secrets scanning.
  # ENCRYPTION_SALT is an app-specific key derivation salt, not a direct secret.
  SECRETS_SCAN_OMIT_KEYS = "FRONTEND_URL,ENCRYPTION_SALT"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Force /api/* onto the function so the Next.js runtime cannot 404 it as a
# missing page. Clerk middleware is also configured to skip these paths.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true
