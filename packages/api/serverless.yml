service: secret-santa-api

frameworkVersion: "3"

useDotenv: true

provider:
  name: aws
  runtime: nodejs20.x
  stage: ${opt:stage, 'dev'}
  region: ${opt:region, 'ap-south-1'}
  memorySize: 256
  timeout: 30
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - ses:SendEmail
            - ses:SendRawEmail
          Resource: "*"
  environment:
    DATABASE_URL: ${env:DATABASE_URL}
    JWT_SECRET: ${env:JWT_SECRET}
    ENCRYPTION_SECRET: ${env:ENCRYPTION_SECRET}
    ENCRYPTION_SALT: ${env:ENCRYPTION_SALT, 'secret-santa-salt-v1'}
    FRONTEND_URL: ${env:FRONTEND_URL, 'http://localhost:3000'}
    SES_FROM_EMAIL: ${env:SES_FROM_EMAIL, 'info@giftwhisper.online'}
    UPSTASH_REDIS_REST_URL: ${env:UPSTASH_REDIS_REST_URL}
    UPSTASH_REDIS_REST_TOKEN: ${env:UPSTASH_REDIS_REST_TOKEN}
    STAGE: ${self:provider.stage}
    # OAuth - Google
    GOOGLE_CLIENT_ID: ${env:GOOGLE_CLIENT_ID, ''}
    GOOGLE_CLIENT_SECRET: ${env:GOOGLE_CLIENT_SECRET, ''}
    GOOGLE_REDIRECT_URI: ${env:GOOGLE_REDIRECT_URI, ''}
    # OAuth - Apple
    APPLE_CLIENT_ID: ${env:APPLE_CLIENT_ID, ''}
    APPLE_TEAM_ID: ${env:APPLE_TEAM_ID, ''}
    APPLE_KEY_ID: ${env:APPLE_KEY_ID, ''}
    APPLE_PRIVATE_KEY: ${env:APPLE_PRIVATE_KEY, ''}
    APPLE_REDIRECT_URI: ${env:APPLE_REDIRECT_URI, ''}
  httpApi:
    cors:
      allowedOrigins:
        - http://localhost:3000
        - ${env:FRONTEND_URL, 'http://localhost:3000'}
        - https://giftwhisper.online
        - https://www.giftwhisper.online
      allowedHeaders:
        - Content-Type
        - Authorization
      allowedMethods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      allowCredentials: true

plugins:
  - serverless-esbuild
  - serverless-domain-manager
  - serverless-offline

custom:
  customDomain:
    domainName: apis.giftwhisper.online
    certificateArn: arn:aws:acm:ap-south-1:000000000000:certificate/5c534062-14c1-4638-9a3f-63fd04ac6afc
    basePath: ""
    stage: ${self:provider.stage}
    createRoute53Record: false
    endpointType: regional
    securityPolicy: tls_1_2
    apiType: http
    autoDomain: true

  esbuild:
    bundle: true
    minify: false
    sourcemap: true
    target: "node20"
    platform: "node"
    format: "cjs"
    mainFields:
      - module
      - main

functions:
  # Auth
  sendMagicLink:
    handler: src/handlers/auth.sendMagicLink
    events:
      - httpApi:
          path: /auth/magic-link
          method: post

  verifyMagicLink:
    handler: src/handlers/auth.verifyMagicLink
    events:
      - httpApi:
          path: /auth/verify
          method: post

  refreshToken:
    handler: src/handlers/auth.refreshToken
    events:
      - httpApi:
          path: /auth/refresh
          method: post

  getMe:
    handler: src/handlers/auth.getMe
    events:
      - httpApi:
          path: /auth/me
          method: get

  # OAuth - Google
  getGoogleAuthUrl:
    handler: src/handlers/oauth.getGoogleAuthUrl
    events:
      - httpApi:
          path: /auth/google
          method: get

  handleGoogleCallback:
    handler: src/handlers/oauth.handleGoogleCallback
    events:
      - httpApi:
          path: /auth/google/callback
          method: post

  # OAuth - Apple
  getAppleAuthUrl:
    handler: src/handlers/oauth.getAppleAuthUrl
    events:
      - httpApi:
          path: /auth/apple
          method: get

  handleAppleCallback:
    handler: src/handlers/oauth.handleAppleCallback
    events:
      - httpApi:
          path: /auth/apple/callback
          method: post

  getUserPreferences:
    handler: src/handlers/user-preferences.getUserPreferences
    events:
      - httpApi:
          path: /user/preferences
          method: get

  updateUserPreferences:
    handler: src/handlers/user-preferences.updateUserPreferences
    events:
      - httpApi:
          path: /user/preferences
          method: patch

  # Profile
  getProfile:
    handler: src/handlers/profile.getProfile
    events:
      - httpApi:
          path: /user/profile
          method: get

  updateProfile:
    handler: src/handlers/profile.updateProfile
    events:
      - httpApi:
          path: /user/profile
          method: patch

  # Teams
  createTeam:
    handler: src/handlers/teams.createTeam
    events:
      - httpApi:
          path: /teams
          method: post

  listTeams:
    handler: src/handlers/teams.listTeams
    events:
      - httpApi:
          path: /teams
          method: get

  getTeam:
    handler: src/handlers/teams.getTeam
    events:
      - httpApi:
          path: /teams/{teamId}
          method: get

  updateTeam:
    handler: src/handlers/teams.updateTeam
    events:
      - httpApi:
          path: /teams/{teamId}
          method: patch

  deleteTeam:
    handler: src/handlers/teams.deleteTeam
    events:
      - httpApi:
          path: /teams/{teamId}
          method: delete

  getTeamStatus:
    handler: src/handlers/teams.getTeamStatus
    events:
      - httpApi:
          path: /teams/{teamId}/status
          method: get

  # Invitations
  inviteMembers:
    handler: src/handlers/invitations.inviteMembers
    events:
      - httpApi:
          path: /teams/{teamId}/invite
          method: post

  listPendingInvitations:
    handler: src/handlers/invitations.listPendingInvitations
    events:
      - httpApi:
          path: /invitations/pending
          method: get

  acceptInvitation:
    handler: src/handlers/invitations.acceptInvitation
    events:
      - httpApi:
          path: /invitations/{token}/accept
          method: post

  acceptInvitationDirect:
    handler: src/handlers/invitations.acceptInvitationDirect
    events:
      - httpApi:
          path: /invitations/{invitationId}/accept-direct
          method: post

  declineInvitation:
    handler: src/handlers/invitations.declineInvitation
    events:
      - httpApi:
          path: /invitations/{token}/decline
          method: post

  declineInvitationDirect:
    handler: src/handlers/invitations.declineInvitationDirect
    events:
      - httpApi:
          path: /invitations/{invitationId}/decline-direct
          method: post

  removeMember:
    handler: src/handlers/invitations.removeMember
    events:
      - httpApi:
          path: /teams/{teamId}/members/{memberId}
          method: delete

  resendInvitation:
    handler: src/handlers/invitations.resendInvitation
    events:
      - httpApi:
          path: /teams/{teamId}/members/{memberId}/resend
          method: post

  # Wishlists
  getWishlist:
    handler: src/handlers/wishlists.getWishlist
    events:
      - httpApi:
          path: /teams/{teamId}/wishlist
          method: get

  updateWishlist:
    handler: src/handlers/wishlists.updateWishlist
    events:
      - httpApi:
          path: /teams/{teamId}/wishlist
          method: put

  getGifteeWishlist:
    handler: src/handlers/wishlists.getGifteeWishlist
    events:
      - httpApi:
          path: /teams/{teamId}/giftee/wishlist
          method: get

  # Addresses
  getAddress:
    handler: src/handlers/addresses.getAddress
    events:
      - httpApi:
          path: /teams/{teamId}/address
          method: get

  updateAddress:
    handler: src/handlers/addresses.updateAddress
    events:
      - httpApi:
          path: /teams/{teamId}/address
          method: put

  getGifteeAddress:
    handler: src/handlers/addresses.getGifteeAddress
    events:
      - httpApi:
          path: /teams/{teamId}/giftee/address
          method: get

  # Assignments
  previewAssignment:
    handler: src/handlers/assignments.previewAssignment
    events:
      - httpApi:
          path: /teams/{teamId}/assign/preview
          method: post

  triggerAssignment:
    handler: src/handlers/assignments.triggerAssignment
    events:
      - httpApi:
          path: /teams/{teamId}/assign
          method: post

  getAssignment:
    handler: src/handlers/assignments.getAssignment
    events:
      - httpApi:
          path: /teams/{teamId}/assignment
          method: get

  updateAssignment:
    handler: src/handlers/assignments.updateAssignment
    events:
      - httpApi:
          path: /teams/{teamId}/assignment
          method: patch

  # Exclusions
  listExclusions:
    handler: src/handlers/exclusions.listExclusions
    events:
      - httpApi:
          path: /teams/{teamId}/exclusions
          method: get

  addExclusion:
    handler: src/handlers/exclusions.addExclusion
    events:
      - httpApi:
          path: /teams/{teamId}/exclusions
          method: post

  removeExclusion:
    handler: src/handlers/exclusions.removeExclusion
    events:
      - httpApi:
          path: /teams/{teamId}/exclusions/{exclusionId}
          method: delete

  # Admin
  sendReminders:
    handler: src/handlers/admin.sendReminders
    events:
      - httpApi:
          path: /teams/{teamId}/reminders
          method: post

  changeUserEmail:
    handler: src/handlers/admin.changeUserEmail
    events:
      - httpApi:
          path: /teams/{teamId}/users/{userId}/email
          method: patch
